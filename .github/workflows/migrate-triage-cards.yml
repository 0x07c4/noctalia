name: Migrate Hidden Triage Cards

# One-off: GitHub hid the Noctalia-CI account, so every Maintainer triage card it
# created is invisible to everyone else and cannot be re-added by the Noctalia
# Automation App (adding the same issue again fails). This recreates each such card
# as the App with the same field values and archive state, then deletes the old one.
# Run with apply=false first and check the job summary. Delete this workflow, the
# MAINTAINER_TRIAGE_TOKEN secret and the Noctalia-CI credential afterwards.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Recreate the cards (false = list only)
        required: true
        type: boolean
        default: false
      limit:
        description: Recreate at most this many cards (0 = all); rerun to continue
        required: true
        type: number
        default: 10

permissions: {}

concurrency:
  group: maintainer-triage-intake-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.repository == 'noctalia-dev/noctalia' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Noctalia Automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: noctalia-dev
          repositories: noctalia,umbriel
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Recreate Noctalia-CI cards as the App
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          LEGACY_TOKEN: ${{ secrets.MAINTAINER_TRIAGE_TOKEN }}
          APPLY: ${{ inputs.apply }}
          LIMIT: ${{ inputs.limit }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const projectId = 'PVT_kwDODYBPq84BmIDl';
            const apply = process.env.APPLY === 'true';
            if (!process.env.LEGACY_TOKEN) throw new Error('MAINTAINER_TRIAGE_TOKEN is not available');
            const legacy = getOctokit(process.env.LEGACY_TOKEN);
            const viewer = (await legacy.graphql('query { viewer { login } }')).viewer.login;
            if (viewer !== 'Noctalia-CI') throw new Error(`Unexpected legacy identity: ${viewer}`);

            // Only Noctalia-CI can still see its own cards.
            const cards = [];
            let cursor = null;
            do {
              const page = await legacy.graphql(`query($id:ID!,$cursor:String) { node(id:$id) { ... on ProjectV2 {
                items(first:100, after:$cursor) {
                  nodes { id isArchived creator { login }
                    content { ... on Issue { id number url repository { name } } ... on PullRequest { id number url repository { name } } }
                    fieldValues(first:50) { nodes {
                      ... on ProjectV2ItemFieldSingleSelectValue { optionId name field { ... on ProjectV2FieldCommon { id name dataType } } }
                      ... on ProjectV2ItemFieldTextValue { text field { ... on ProjectV2FieldCommon { id name dataType } } }
                      ... on ProjectV2ItemFieldDateValue { date field { ... on ProjectV2FieldCommon { id name dataType } } }
                      ... on ProjectV2ItemFieldNumberValue { number field { ... on ProjectV2FieldCommon { id name dataType } } }
                    } }
                  }
                  pageInfo { hasNextPage endCursor }
                } } } }`, { id: projectId, cursor });
              const items = page.node.items;
              cards.push(...items.nodes.filter(item => item.creator?.login === 'Noctalia-CI' && item.content?.id));
              cursor = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
            } while (cursor);
            // Values to copy: custom fields only; built-in ones (title, labels, ...) follow the content.
            const valueOf = entry => {
              switch (entry.field?.dataType) {
                case 'SINGLE_SELECT': return entry.optionId ? { singleSelectOptionId: entry.optionId } : null;
                case 'TEXT': return typeof entry.text === 'string' ? { text: entry.text } : null;
                case 'DATE': return entry.date ? { date: entry.date } : null;
                case 'NUMBER': return typeof entry.number === 'number' ? { number: entry.number } : null;
                default: return null;
              }
            };
            // Paced well under GitHub's secondary limits (content-creating requests per
            // minute); rate-limit and server errors are retried, anything else is final.
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function call(client, query, variables, what) {
              for (let attempt = 1; ; attempt++) {
                await pause(1500);
                try { return await client.graphql(query, variables); }
                catch (error) {
                  const transient = error.status === 403 || error.status === 429 || error.status >= 500 || /rate limit|abuse|RATE_LIMITED/i.test(error.message);
                  if (!transient || attempt >= 6) throw error;
                  const wait = Math.min(60000 * attempt, 300000);
                  core.warning(`${what}: ${error.message}; retrying in ${wait / 1000}s`);
                  await pause(wait);
                }
              }
            }
            const limit = Number(process.env.LIMIT) > 0 ? Number(process.env.LIMIT) : cards.length;
            const rows = [['Card', 'Archived', 'Fields', 'Result']];
            let done = 0;
            for (const card of cards) {
              const label = `${card.content.repository.name}#${card.content.number}`;
              const values = card.fieldValues.nodes.map(entry => ({ entry, value: valueOf(entry) })).filter(({ value }) => value);
              const summary = values.map(({ entry, value }) => `${entry.field.name}=${entry.name ?? Object.values(value)[0]}`).join(', ');
              let result = 'listed';
              if (apply && done < limit) {
                await call(legacy, 'mutation($p:ID!,$i:ID!) { deleteProjectV2Item(input:{projectId:$p,itemId:$i}) { deletedItemId } }', { p: projectId, i: card.id }, `${label} delete`);
                try {
                  const added = await call(github, 'mutation($p:ID!,$c:ID!) { addProjectV2ItemById(input:{projectId:$p,contentId:$c}) { item { id } } }', { p: projectId, c: card.content.id }, `${label} add`);
                  const itemId = added.addProjectV2ItemById.item.id;
                  if (values.length) {
                    const definitions = values.map((_, index) => `$v${index}:UpdateProjectV2ItemFieldValueInput!`).join(',');
                    const aliases = values.map((_, index) => `f${index}:updateProjectV2ItemFieldValue(input:$v${index}){projectV2Item{id}}`).join(' ');
                    const variables = Object.fromEntries(values.map(({ entry, value }, index) => [`v${index}`, { projectId, itemId, fieldId: entry.field.id, value }]));
                    await call(github, `mutation(${definitions}) { ${aliases} }`, variables, `${label} fields`);
                  }
                  if (card.isArchived) await call(github, 'mutation($p:ID!,$i:ID!) { archiveProjectV2Item(input:{projectId:$p,itemId:$i}) { item { id } } }', { p: projectId, i: itemId }, `${label} archive`);
                  result = `recreated ${itemId}`;
                  done++;
                } catch (error) {
                  // The old card is already gone: stop before touching any other card.
                  core.error(`${label} (${card.content.url}) was deleted but not fully recreated: ${error.message}. Re-add it by hand with: ${summary || 'no custom values'}${card.isArchived ? ', archived' : ''}`);
                  rows.push([`[${label}](${card.content.url})`, card.isArchived ? 'yes' : 'no', summary || '—', `FAILED: ${error.message}`]);
                  await core.summary.addHeading('Stopped after a failure').addTable(rows.map((row, index) => index ? row : row.map(data => ({ data, header: true })))).write();
                  throw error;
                }
              } else if (apply) {
                result = 'left for the next run';
              }
              core.info(`${label}: ${result} [${summary}]`);
              rows.push([`[${label}](${card.content.url})`, card.isArchived ? 'yes' : 'no', summary || '—', result]);
            }
            const heading = apply ? `Recreated ${done} of ${cards.length} Noctalia-CI cards${done < cards.length ? '; run again to continue' : ''}` : `Found ${cards.length} Noctalia-CI cards`;
            await core.summary.addHeading(heading).addTable(rows.map((row, index) => index ? row : row.map(data => ({ data, header: true })))).write();
